<!DOCTYPE html>
<html>
<head>
    <title>Operaciones con dos números</title>
    <style>
        .container {
            text-align: center;
            margin-top: 50px;
        }
        .content {
            display: inline-block;
            text-align: left;
        }
        .input-container {
            display: flex;
            align-items: center;
            margin-bottom: 10px;
        }
        .input-container label {
            width: 150px;
            margin-right: 10px;
        }
        .input-container input[type="text"] {
            width: 150px;
        }
    </style>
</head>
<body>

<div class="container">
    <div class="content">
        <h2>Suma, resta y multiplicación de dos números</h2>

        <form>
            <div class="input-container">
                <label for="num1">Primer número:</label>
                <input type="text" id="num1">
            </div>
            <div class="input-container">
                <label for="num2">Segundo número:</label>
                <input type="text" id="num2">
            </div>
            <input type="button" value="Calcular suma"         style="background-color: green;" onclick="calcularSuma()">
            <input type="button" value="Calcular resta"        style="background-color: red;"   onclick="calcularResta()">
            <input type="button" value="Calcular producto"     style="background-color: blue;"  onclick="calcularProducto()">
<input type="button" value="Calcular suma"  style="background-color: red;" onclick="calcularSuma()">
<input type="button" value="Calcular resta" style="background-color: green;"   onclick="calcularResta()">
<input type="button" value="Calcular cociente" style="backgorund-color: purple;" onclick="calcularCociente()">


        </form>

        <div id="resultado"></div>
    </div>
</div>

<script>
function calcularSuma() {
    var num1 = parseFloat(document.getElementById("num1").value);
    var num2 = parseFloat(document.getElementById("num2").value);

    if (!isNaN(num1) && !isNaN(num2)) {
        var suma = num1 + num2;
        document.getElementById("resultado").innerHTML =
            "El resultado de la suma es: " + suma;
    } else {
        document.getElementById("resultado").innerHTML =
            "Por favor, ingrese dos números válidos.";
    }
}

function calcularResta() {
    var num1 = parseFloat(document.getElementById("num1").value);
    var num2 = parseFloat(document.getElementById("num2").value);

    if (!isNaN(num1) && !isNaN(num2)) {
        var resta = num1 - num2;
        document.getElementById("resultado").innerHTML =
            "El resultado de la resta es: " + resta;
    } else {
        document.getElementById("resultado").innerHTML =
            "Por favor, ingrese dos números válidos.";
    }
}

function calcularProducto() {
    var num1 = parseFloat(document.getElementById("num1").value);
    var num2 = parseFloat(document.getElementById("num2").value);

    if (!isNaN(num1) && !isNaN(num2)) {
        var producto = num1 * num2;
        document.getElementById("resultado").innerHTML =
            "El resultado del producto es: " + producto;
}
}
function calcularCociente() {
    var num1 = parseFloat(document.getElementById("num1").value);
    var num2 = parseFloat(document.getElementById("num2").value);

    if (!isNaN(num1) && !isNaN(num2) && num2 !== 0) {
        var cociente = num1 / num2;
        document.getElementById("resultado").innerHTML =
            "El resultado del cociente es: " + cociente;
    } else if (num2 === 0) {
        document.getElementById("resultado").innerHTML =
            "No se puede dividir entre cero.";
    } else {
        document.getElementById("resultado").innerHTML =
            "Por favor, ingrese dos números válidos.";
    }
}
</script>

</body>
</html>
